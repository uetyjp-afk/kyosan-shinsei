<style>

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--tx);font-size:15px}

header .lg{font-size:26px;background:#fff;border-radius:9px;width:38px;height:38px;display:flex;align-items:center;justify-content:center}

header .sub{font-size:11px;opacity:.85}
main{max-width:1180px;margin:0 auto;padding:12px;display:block}
@media(min-width:900px){main{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px;align-items:start}.pv{position:sticky;top:70px}}
.pv,.fm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(25,45,75,.06)}
.pv h2,.fm h2{font-size:13px;margin:0 0 8px;color:var(--ac);letter-spacing:.06em}
.cv{position:relative;width:100%;aspect-ratio:595/842;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.cv img.bg{position:absolute;inset:0;width:100%;height:100%}
.sec{border-top:2px solid var(--ac);margin-top:14px;padding-top:8px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sec>h3{font-size:13.5px;margin:0 0 8px;color:var(--ac)}
.fr{display:flex;align-items:center;gap:8px;margin:7px 0}
.fr label{flex:0 0 92px;font-size:13px;color:var(--mut)}
.fr input[type=text],.fr input[type=number],.fr textarea{flex:1;min-width:0;border:1.6px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;background:#fff;color:var(--tx)}
.fr textarea{resize:vertical}
.fr .unit{flex:0 0 auto;font-size:13px;color:var(--mut)}
.fr3{display:flex;gap:6px;flex:1;min-width:0;align-items:center}
.fr3 input{flex:1 1 0%;width:0;min-width:0;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 2px}
.chip{border:1.8px solid var(--ac2);color:var(--ac);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.sm{padding:5px 10px;font-size:13px}
table.rows{width:100%;border-collapse:collapse}
table.rows th{font-size:11.5px;color:var(--mut);font-weight:600;padding:2px 3px;text-align:left}
table.rows td{padding:2.5px 3px}
table.rows input{width:100%;border:1.4px solid var(--line);border-radius:7px;padding:7px 7px;font-size:14px}
table.rows .amt{text-align:right}
.pick{flex:0 0 auto;border:1.6px solid var(--ac2);background:#eaf2fa;color:var(--ac);border-radius:8px;padding:7px 9px;font-size:12.5px;cursor:pointer}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1;min-width:130px;border:0;border-radius:11px;padding:13px 10px;font-size:15.5px;font-weight:700;cursor:pointer}
.btn.main{background:var(--ac);color:#fff}
.btn.sub{background:#e7edf4;color:var(--ac)}
.btn.ghost{background:#fff;color:var(--mut);border:1.4px solid var(--line)}
#msg{font-size:13.5px;color:var(--ac);margin-top:9px;min-height:19px}
.note{font-size:12px;color:var(--mut);line-height:1.6;margin-top:6px}
#picker{position:fixed;inset:0;background:rgba(15,30,50,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
#picker.open{display:flex}
.pk{background:#fff;width:100%;max-width:560px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:14px}
.pk h3{margin:0 0 8px;font-size:15px;color:var(--ac)}
.pk input{border:1.8px solid var(--line);border-radius:10px;padding:11px;font-size:16px;width:100%}
.pk .list{overflow:auto;margin-top:10px}
.pk .item{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.pk .item b{color:var(--ac);margin-right:8px}
.pk .item small{display:block;color:var(--mut);margin-top:2px}
.pk .x{align-self:flex-end;border:0;background:#e7edf4;border-radius:9px;padding:8px 14px;font-size:14px;cursor:pointer}
.imp{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-info{font-size:12.5px;color:var(--mut)}
@media print{
 body{background:#fff}header,.fm,#splash,#picker{display:none!important}
 main{display:block;padding:0;max-width:none}
 .pv{border:0;box-shadow:none;padding:0}.pv h2,.pv .note{display:none}
 .cv{border:0;border-radius:0}
 @page{size:A4;margin:0}
}
</style>
</head>

<header><div class="lg">📄</div><div><h1>協賛金申請書</h1><div class="sub">NJH-0017／入力してPDF作成・印刷</div></div></header>

 parent.appendChild(box);return box}

 if(u)rb.appendChild(el('span',{className:'unit',textContent:u}))});
rd.appendChild(rb);s.appendChild(rd);
row3(s,'算出期間（自）',['perY1','perM1'],['年','月']);
row3(s,'算出期間（至）',['perY2','perM2'],['年','月']);
/* 覚書・備考 */
s=sec('覚書・備考');
chips(s,'kakusho',[['ari','覚書あり'],['nashi','覚書なし']],false);
row(s,'協賛条件・目標','mokuhyo');row(s,'協賛条件・実績','jisseki2');
tarea(s,'備考欄','bikou',3);
/* ワーキング・ダミー */
s=sec('ワーキング・ダミーの場合');
row3(s,'希望納期',['nY','nM','nD'],['年','月','日']);
chips(s,'okurisaki',[['kijo','営業机上'],['hanten','販売店'],['eigyosho','営業所経由']],false);
chips(s,'seisaku',[['stock','ストックカナル'],['impression','インプレッション'],['henpin','返品分'],['kenonki','検音器']],true);
chips(s,'shell',[['beige','ベージュ（通常）'],['color','カラー']],false);
row(s,'カラー名','colorName');
chips(s,'tegusu',[['wa','輪テグス'],['ippon','一本テグス'],['nashi','テグスなし']],false);
row(s,'テグス長さ','tegusuLen',{num:true,unit:'mm'});
chips(s,'vent',[['ari','ベントあり'],['nashi','ベントなし']],false);
row(s,'ベント径','ventMm',{num:true,unit:'mm'});
chips(s,'vol',[['ari','ボリュームあり'],['nashi','ボリュームなし']],false);
chips(s,'nidan',[['on','二段ボリューム']],false).querySelector('.chip').onclick=function(){
 V.nidan=!V.nidan;this.classList.toggle('on',V.nidan);draw()};
chips(s,'pb',[['ari','PBメモリーあり'],['nashi','PBメモリーなし']],false);
tarea(s,'その他要望事項','sonota',2);
/* 印鑑チップの初期表示 */
document.querySelectorAll('.chip').forEach(c=>{if(c.textContent.startsWith('印鑑'))c.classList.toggle('on',V.stamp);
 if(c.textContent==='二段ボリューム')c.classList.toggle('on',V.nidan)});
/* ===== 取引先ピッカー ===== */
let pkRow=0;
function openPicker(ix){pkRow=ix;$('#picker').classList.add('open');renderPk('');const q=$('#pkq');q.value='';setTimeout(()=>q.focus(),60)}
function renderPk(q){
 const list=$('#pklist');list.innerHTML='';
 const hits=CLIENTS.filter(c=>!q||c.code.includes(q)||c.n1.includes(q)||c.n2.includes(q)).slice(0,60);
 if(!CLIENTS.length){list.appendChild(el('div',{className:'item',textContent:'得意先リストが未読み込みです。いったん閉じて、プレビュー下の「📋 得意先リスト読み込み」から読み込んでください'}));return}
 if(!hits.length){list.appendChild(el('div',{className:'item',textContent:'見つかりません'}));return}
 hits.forEach(c=>{const d=el('div',{className:'item'});
  const b=el('b',{textContent:c.code});d.appendChild(b);
  d.appendChild(document.createTextNode(c.n1+(c.n2?' '+c.n2:'')));
  d.appendChild(el('small',{textContent:(c.zip?'〒'+c.zip+' ':'')+c.addr+(c.tel?'　☎'+c.tel:'')}));
  d.onclick=()=>{const r=V.rows[pkRow];r.code=c.code;r.name=(c.n1+' '+(c.n2||'')).trim();
   document.querySelectorAll('table.rows tr')[pkRow+1].querySelectorAll('input').forEach((inp,j)=>{inp.value=[r.code,r.name,r.naiyou,r.amt][j]});
   $('#picker').classList.remove('open');draw()};
  list.appendChild(d)})}
$('#pkq').oninput=e=>renderPk(e.target.value.trim());
$('#pkx').onclick=()=>$('#picker').classList.remove('open');
$('#picker').onclick=e=>{if(e.target.id==='picker')$('#picker').classList.remove('open')};
/* ===== 描画 ===== */
const hanko=new Image();
try{const hs=localStorage.getItem('kyosan_hanko');if(hs)hanko.src=hs}catch(e){}
function fit(t,x,y,a,fs,mw,bold){
 t=String(t||'');if(!t)return;
 ctx.fillStyle='#17233b';let f=fs;
 ctx.font=(bold?'700 ':'')+f*S+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
 const wid=()=>ctx.measureText(t).width/S;
 while(wid()>mw&&f>6){f-=0.5;ctx.font=(bold?'700 ':'')+f*S+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif'}
 ctx.textAlign=a==='r'?'right':a==='c'?'center':'left';ctx.textBaseline='alphabetic';
 ctx.fillText(t,x*S,y*S)}
function chk(cx,cy){ctx.save();ctx.translate(cx*S,cy*S);ctx.strokeStyle='#1c4f9c';ctx.lineWidth=1.7*S;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(-2.1*S,0.1*S);ctx.lineTo(-0.6*S,1.9*S);ctx.lineTo(2.4*S,-1.8*S);ctx.stroke();ctx.restore()}
function mark(group,key){const p=CHK[group][key];if(p)chk(p[0],p[1])}
function wrap(t,x,yTop,mw,fs,lh,maxLines){
 ctx.fillStyle='#17233b';ctx.font=fs*S+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
 ctx.textAlign='left';ctx.textBaseline='alphabetic';
 let line='',lines=[];
 for(const ch of String(t||'')){if(ch==='\n'){lines.push(line);line='';continue}
  if(ctx.measureText(line+ch).width/S>mw){lines.push(line);line=ch}else line+=ch}
 if(line)lines.push(line);
 lines.slice(0,maxLines).forEach((ln,i)=>ctx.fillText(ln,x*S,(yTop+fs+i*lh)*S))}
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);
 TXT.forEach(([k,x,y,a,fs,mw,ism])=>fit(ism?money(V[k]):V[k],x,y,a,fs,mw));
 V.rows.forEach((r,i)=>{const y=ROWY[i];
  fit(r.code,54,y,'l',9,40);fit(r.name,100,y,'l',9.5,155);
  fit(r.naiyou,261,y,'l',9.5,168);fit(money(r.amt),540,y,'r',10.5,100)});
 fit(money(V.total),540,260.5,'r',11.5,110,true);
 (V.type||[]).forEach(v=>mark('type',v));
 ['tainou','hassou','shiharai','kakusho','okurisaki','shell','tegusu','vent','vol','pb'].forEach(g=>{if(V[g])mark(g,V[g])});
 (V.tenpu||[]).forEach(v=>mark('tenpu',v));
 (V.seisaku||[]).forEach(v=>mark('seisaku',v));
 if(V.nidan)chk(CHK.nidan[0],CHK.nidan[1]);
 wrap(V.bikou,100,577,97,8.5,11.5,4);
 wrap(V.sonota,100,736,438,9.5,12.5,3);
 if(V.stamp&&hanko.complete&&hanko.naturalWidth){
  ctx.drawImage(hanko,514.4*S,103.8*S,20.2*S,18.5*S);
  ctx.drawImage(hanko,(V.stampPos==='eigyo'?327.0:290.4)*S,593*S,26.2*S,24*S)}
}
hanko.onload=draw;
/* ===== 出力 ===== */
$('#go').onclick=async()=>{const m=$('#msg');m.textContent='作成中…';
 try{if(!window.PDFLib)throw new Error('PDF部品を読み込めませんでした。通信状況を確認してください。');
  draw();const png=await new Promise(r=>cv.toBlob(r,'image/png')),bin=new Uint8Array(await (await fetch('./form.pdf')).arrayBuffer());
  const doc=await PDFLib.PDFDocument.load(bin),pg=doc.getPage(0),im=await doc.embedPng(new Uint8Array(await png.arrayBuffer())),sz=pg.getSize();
  pg.drawImage(im,{x:0,y:0,width:sz.width,height:sz.height});const out=await doc.save(),
  ymd=td.getFullYear()+('0'+(td.getMonth()+1)).slice(-2)+('0'+td.getDate()).slice(-2),name='協賛金申請書_'+ymd+'.pdf';
  const a=el('a',{href:URL.createObjectURL(new Blob([out],{type:'application/pdf'})),download:name});
  document.body.appendChild(a);a.click();a.remove();m.textContent='保存しました：'+name}
 catch(e){m.textContent='保存できませんでした：'+(e.message||e)}};
$('#print').onclick=()=>{draw();window.print()};
$('#clr').onclick=()=>{if(!confirm('入力内容をクリアしますか？（所属・担当者は残ります）'))return;location.reload()};
/* ===== 得意先リスト・印鑑の読み込み（端末内だけに保存） ===== */
function impInfo(){const s=$('#impInfo');if(s)s.textContent=CLIENTS.length?('得意先リスト：'+CLIENTS.length+'件 読み込み済み'):'得意先リスト：未読み込み（初回は読み込んでください）'}
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').addEventListener('change',ev=>{
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  const list=Array.isArray(d)?d:d.clients;
  if(!Array.isArray(list)||!list.length)throw new Error('リストが入っていません');
  CLIENTS=list;localStorage.setItem('kyosan_clients',JSON.stringify(list));
  if(d.hanko){localStorage.setItem('kyosan_hanko',d.hanko);hanko.src=d.hanko}
  impInfo();draw();
  if(d.settings){localStorage.setItem('kyosan_settings',JSON.stringify(d.settings));
   $('#msg').textContent='読み込みました（'+list.length+'件）。所属・担当者・印鑑を登録して、再読み込みします';
   setTimeout(()=>location.reload(),900);
  }else $('#msg').textContent='得意先リストを読み込みました（'+list.length+'件）';
 }catch(e){$('#msg').textContent='読み込めませんでした：'+(e.message||e)}};
 r.readAsText(f);ev.target.value='';
});
impInfo();
document.querySelector('.cv img.bg').onload=draw;
draw();
window.__t={get V(){return V},draw,set:(k,v)=>{V[k]=v;draw()}};
setTimeout(()=>$('#splash').classList.add('hide'),80);
</script>
